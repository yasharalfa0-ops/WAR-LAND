<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAR LAND</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div><strong>WAR LAND</strong><span class="subtitle">World War II Grand Strategy</span></div>
    <div class="date">سپتامبر ۱۹۳۹</div>
  </header>
  <main class="layout">
    <aside class="panel left">
      <h2>کشور</h2>
      <div class="country-card"><div class="flag">🇩🇪</div><div><strong>آلمان</strong><small>Berlin</small></div></div>
      <div class="stat"><span>💰 بودجه</span><b id="money">100M</b></div>
      <div class="stat"><span>🛢️ نفت</span><b>60K</b></div>
      <div class="stat"><span>⛓️ فولاد</span><b>120K</b></div>
      <div class="stat"><span>🪨 زغال‌سنگ</span><b>200K</b></div>
      <div class="stat"><span>🔩 آلومینیوم</span><b>50K</b></div>
    </aside>
    <section class="map-wrap">
      <div class="map" id="map">
        <div class="ocean-label">EUROPE • 1939</div>
        <button class="city germany" data-city="برلین">🇩🇪<span>برلین</span></button>
        <button class="city poland" data-city="ورشو">🇵🇱<span>ورشو</span></button>
        <button class="city france" data-city="پاریس">🇫🇷<span>پاریس</span></button>
        <button class="city uk" data-city="لندن">🇬🇧<span>لندن</span></button>
        <button class="city ussr" data-city="مسکو">🇷🇺<span>مسکو</span></button>
        <div class="frontline"></div>
      </div>
      <div class="map-controls"><button id="zoomIn">+</button><button id="zoomOut">−</button><button id="resetZoom">⌂</button></div>
    </section>
    <aside class="panel right">
      <h2>فرماندهی</h2>
      <button class="action" id="endTurn">⏭️ پایان نوبت</button>
      <button class="action">🪖 ارتش</button>
      <button class="action">🏭 صنعت</button>
      <button class="action">🤝 دیپلماسی</button>
      <button class="action">🔬 فناوری</button>
      <button class="action jessi">🤖 JESSI</button>
      <div class="log" id="log"><b>گزارش</b><p>جنگ در اروپا آغاز شده است.</p></div>
    </aside>
  </main>
  <script src="app.js"></script>
</body>
</html>
